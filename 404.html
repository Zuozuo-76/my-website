<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Yawen Zuo</title>
  <link rel="icon" type="image/png" href="favicon-v2.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8f1f4;
      background: radial-gradient(circle at 70% 20%, #103b50, transparent 38%), #05131f;
    }
    main { max-width: 680px; text-align: center; }
    .code { color: #2dd4bf; font-size: clamp(80px, 22vw, 180px); font-weight: 900; line-height: 0.9; letter-spacing: -0.08em; }
    h1 { margin: 28px 0 10px; font-size: clamp(30px, 6vw, 48px); }
    p { margin: 0 0 30px; color: #b8c9d2; font-size: 18px; }
    a { display: inline-flex; padding: 14px 20px; border-radius: 12px; background: #2dd4bf; color: #05131f; text-decoration: none; font-weight: 850; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>这个页面不存在，返回主页继续浏览作品集。</p>
    <a href="./">Back to portfolio · 返回主页</a>
  </main>
</body>
</html>
